worker_processes 1;
pid /run/gvai-ingress/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    default_type application/json;
    log_format redacted '$status $body_bytes_sent $request_time';
    access_log /var/log/gvai-ingress/access.log redacted;

    client_max_body_size 16384;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 0;
    reset_timedout_connection on;
    client_body_temp_path /run/gvai-ingress/body;
    proxy_temp_path /run/gvai-ingress/proxy;
    fastcgi_temp_path /run/gvai-ingress/fastcgi;
    uwsgi_temp_path /run/gvai-ingress/uwsgi;
    scgi_temp_path /run/gvai-ingress/scgi;

    limit_req_zone $binary_remote_addr zone=per_client:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=per_client_connections:1m;
    limit_conn_zone $server_name zone=total_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level error;
    limit_conn_log_level error;

    map "$request_method:$request_uri" $allowed_request {
        default 0;
        "POST:/v1/evaluations" 1;
        "GET:/healthz" 1;
        "GET:/readyz" 1;
        "~^GET:/v1/usage/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" 1;
    }

    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name _;
        ssl_certificate /etc/gvai-ingress/server-chain.pem;
        ssl_certificate_key /etc/gvai-ingress/server-key.pem;
        ssl_client_certificate /etc/gvai-ingress/client-ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_tickets off;
        ssl_session_cache off;

        limit_req zone=per_client burst=4 nodelay;
        limit_conn per_client_connections 4;
        limit_conn total_connections 8;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;

        if ($allowed_request = 0) { return 404; }

        error_page 400 401 403 404 405 408 413 414 429 431 495 496 497 500 502 503 504 = @failure;
        location @failure {
            return 503 '{"error":{"code":"ingress_unavailable","message":"Private advisory ingress unavailable."}}';
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host gvai-private-backend;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection close;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 20s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_hide_header Server;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
