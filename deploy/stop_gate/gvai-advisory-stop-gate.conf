# Drop-in for gvai-advisory.service (install as
# /etc/systemd/system/gvai-advisory.service.d/stop-gate.conf). The API may reach ONLY the two
# service sockets; everything the gate and backend own is made invisible to it.
[Service]
InaccessiblePaths=/etc/gvai-stop-gate /var/lib/gvai-stop-gate /etc/gvai-backend /run/gvai-stop-gate/control.sock /run/gvai-protected-backend/notice.sock
