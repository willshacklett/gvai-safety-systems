name: pipeline-security

# Static policy checks for the Lab-01 pipeline. GitHub-hosted, read-only, no secrets, no deploy.
on:
  pull_request:
    branches: ["integration/**", "main"]
    paths:
      - ".github/workflows/**"
      - "deploy/lab01_ci/**"
      - "scripts/pipeline_security_check.py"
      - "scripts/verify_lab01_evidence.py"
      - "tests/test_lab01_ci_pipeline.py"
  push:
    branches: ["integration/**", "feature/secure-phone-deploy-pipeline"]

permissions:
  contents: read

concurrency:
  group: pipeline-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pipeline security policy
        run: python scripts/pipeline_security_check.py
      - name: Pipeline tests
        run: python -m pytest -q tests/test_lab01_ci_pipeline.py
      - name: Shell syntax and shellcheck
        run: |
          bash -n deploy/lab01_ci/host/bootstrap_lab01_ci.sh
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck deploy/lab01_ci/host/bootstrap_lab01_ci.sh
