name: pipeline-security

# Static policy checks for the Lab-01 pipeline. GitHub-hosted, read-only, no secrets, no deploy.
on:
  # No path filter: a path-filtered workflow does not report a status when skipped, which would let a
  # required check be bypassed by touching other files.
  pull_request:
    branches: ["integration/**", "main"]
  push:
    branches: ["integration/**", "feature/secure-phone-deploy-pipeline"]

permissions:
  contents: read

concurrency:
  group: pipeline-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pipeline security policy
        run: python scripts/pipeline_security_check.py
      - name: Control-file integrity manifest (tamper-evidence, not a boundary)
        run: python scripts/pipeline_integrity.py check
      - name: Report changed control files for CODEOWNERS review
        run: |
          [[ -n "$BASE_REF" ]] || exit 0
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- .github deploy/lab01_ci deploy/stop_gate scripts/pipeline_security_check.py scripts/pipeline_integrity.py scripts/verify_lab01_evidence.py scripts/verify_lab01_environment.py tests/test_lab01_ci_pipeline.py requirements-dev.txt)"
          if [[ -n "$changed" ]]; then
            { echo "### Control files changed - CODEOWNER review is REQUIRED (enforced only by repository rulesets)"; echo '```'; echo "$changed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pipeline tests
        run: python -m pytest -q tests/test_lab01_ci_pipeline.py
      - name: Shell syntax and shellcheck
        run: |
          bash -n deploy/lab01_ci/host/bootstrap_lab01_ci.sh
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck deploy/lab01_ci/host/bootstrap_lab01_ci.sh
