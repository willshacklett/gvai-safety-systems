name: integration-tests

# Validation only. Deliberately has no deployment, Pages, secrets, or write permissions, and never
# runs for main (tests.yml covers main; deploy-public-site.yml is the only deploy path).
on:
  push:
    branches: ["integration/**"]
  pull_request:
    branches: ["integration/**"]

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run full suite (skips are reported, never hidden)
        run: python -m pytest -q -rs
