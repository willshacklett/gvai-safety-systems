name: lab01-readonly-validate

# STAGE 1 - READ-ONLY. Collects security/readiness evidence from Lab-01. Changes nothing.
#
# Safety properties (enforced by scripts/pipeline_security_check.py in CI):
# - workflow_dispatch only; no PR/fork/workflow_run triggers. Dispatchable only once this file is on
#   the default branch, i.e. after the founder merges it.
# - Fails closed unless repo variable LAB01_VALIDATION_ENABLED == 'true' (default: unset = off).
# - The Lab-01 job needs the `lab01-readonly` Environment (required founder approval, branch policy).
# - The Lab-01 job runs on an UNPRIVILEGED runner, has no GITHUB_TOKEN permissions, no secrets, does
#   NOT check out repository code, and only executes the root-owned installed collector.
# - No runner path can reach STOP-gate keys, trusted anchors or shutdown controls.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lab01-host-access
  cancel-in-progress: false

jobs:
  gate:
    name: fail-closed gate (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ENABLED: ${{ vars.LAB01_VALIDATION_ENABLED }}
      REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Fail closed unless explicitly enabled by the founder
        run: |
          set -euo pipefail
          [[ "$ENABLED" == "true" ]] || { echo "::error::LAB01_VALIDATION_ENABLED is not 'true'"; exit 1; }
          [[ "$EVENT" == "workflow_dispatch" ]] || { echo "::error::unexpected event"; exit 1; }
          [[ "$ACTOR" == "$OWNER" ]] || { echo "::error::only the repository owner may dispatch"; exit 1; }
          case "$REF" in
            refs/heads/main|refs/heads/integration/advisory-launch-base) ;;
            *) echo "::error::ref not allowed: $REF"; exit 1 ;;
          esac
      - name: Check out reviewed ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install policy-check dependency
        run: python -m pip install "PyYAML>=6.0"
      - name: Pipeline security policy check
        run: python scripts/pipeline_security_check.py
      - name: Audit record
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Audit"
            echo "- stage: lab01-readonly-validate (read-only)"
            echo "- actor: $ACTOR  event: $EVENT  ref: $REF"
            echo "- sha: $SHA  run: $RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    name: collect evidence on Lab-01 (founder approval required)
    needs: gate
    runs-on: [self-hosted, linux, x64, gvai-lab01-readonly]
    timeout-minutes: 10
    environment: lab01-readonly
    permissions: {}
    steps:
      - name: Run installed read-only collector (no repository code is executed)
        run: |
          set -euo pipefail
          umask 077
          /usr/local/libexec/gvai-ci/lab01-readonly-collect --output "$RUNNER_TEMP/lab01-evidence.json"
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab01-readonly-evidence
          path: ${{ runner.temp }}/lab01-evidence.json
          retention-days: 14
          if-no-files-found: error

  verify:
    name: verify evidence (GitHub-hosted)
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lab01-readonly-evidence
          path: evidence
      - name: Verify evidence schema, secrets scan, and fail-closed checks
        run: python3 scripts/verify_lab01_evidence.py evidence/lab01-evidence.json --summary "$GITHUB_STEP_SUMMARY"
