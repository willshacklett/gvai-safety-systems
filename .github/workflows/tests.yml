name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

  postgres-integration:
    # Disposable-PostgreSQL suites must RUN here: any skip is a failure.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt "psycopg[binary]>=3.1"

      - name: Pull the disposable PostgreSQL image
        run: |
          docker pull postgres:16
          docker pull postgres@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c

      - name: Run PostgreSQL integration tests (no skips allowed)
        env:
          GVAI_RUN_PAID_POSTGRES: "1"
          GVAI_RUN_PAID_CHECKOUT_POSTGRES: "1"
          GVAI_RUN_SELF_SERVICE_POSTGRES: "1"
          GVAI_REQUIRE_SELF_SERVICE_POSTGRES: "1"
          GVAI_RUN_RECONCILER_POSTGRES: "1"
          GVAI_REQUIRE_RECONCILER_POSTGRES: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            tests/test_reconciler_postgresql.py tests/test_self_service.py \
            tests/test_paid_checkout_persistence.py tests/test_paid_postgresql.py tests/test_commercial_baseline.py \
            tests/test_stripe_billing.py tests/test_billing_reconciler.py | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "Skipped PostgreSQL tests are not allowed."; exit 1; fi
