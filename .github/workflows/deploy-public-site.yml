name: Deploy allowlisted public site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  validate_build:
    if: github.repository == 'willshacklett/gvai-safety-systems' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run repository regression suite
        run: python -m pytest -q

      - name: Run public-site validation
        run: python -m unittest discover -s tests -p 'test_public_site.py'

      - name: Build allowlisted public artifact
        run: python scripts/prepare_public_site.py --output dist/public-site

      - name: Upload only the public artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/public-site
          retention-days: 1

  deploy:
    if: github.repository == 'willshacklett/gvai-safety-systems' && github.ref == 'refs/heads/main'
    needs: validate_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Require GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" \
            | python -c 'import json, sys; print(json.load(sys.stdin).get("build_type", ""))')"
          if [[ "$pages_build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages source must be set to GitHub Actions before deployment."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy approved artifact
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
